[package]
name = "pstrings"
version = "0.1.45"
edition = "2024"
description = "Parallel strings extractor for very large files"

[lib]
name = "pstrings"
path = "src/lib.rs"
 
[[bin]]
name = "pstrings"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
tempfile = "3.27"
itoa = "1"
encoding_rs = "0.8.35"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
debug = true
